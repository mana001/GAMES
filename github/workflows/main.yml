name: Auto Unzip Any Archive

on:
  push:
    branches:
      - main

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract .zip file
        run: |
          # Find the first .zip file in the repository root
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in root directory. Skipping extract."
            exit 0
          fi

          echo "Found zip file: $ZIP_FILE"
          
          # Unzip files overwriting duplicates
          unzip -o "$ZIP_FILE"

          # Remove the zip file after extraction
          rm "$ZIP_FILE"
          echo "Extraction complete and removed original zip."

      - name: Commit and Push extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add extracted files
          git add -A

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-unzipped archive contents"
            git push origin main
          fi
